# OpenAPI 3.1 契约 —— vscode-ue-helper 插件能力全景(阶段 1)
#
# 定位:spec-as-is —— 把既有 27 个 VSCode 命令 + 9 个 MCP 工具规格化为机器可验证契约。
# 传输说明:VSCode 命令与 MCP(JSON-RPC over stdio)都不是 HTTP;本契约的
# POST /commands/* 与 POST /mcp/tools/* 是**逻辑 RPC 模型**,servers 条目仅为占位。
# 语义对齐源:src/commands/index.ts(registerCommand 注册表)、src/mcp/tools.ts(callTool 分发)。

openapi: 3.1.0
info:
  title: vscode-ue-helper 插件能力契约
  version: 0.2.0
  description: |
    UE C++ 开发的 VSCode 全能插件:UBT 构建、Live Coding 热重载、clangd 智能感知、
    项目诊断与可选 MCP AI agent 集成。

    本契约覆盖全部存量能力(27 个 VSCode 命令 + 9 个 MCP 工具),作为阶段 1
    构建/验证/评审的单一可信源。命令通过 VSCode command palette / UI 触发;
    MCP 工具由 AI agent 通过 MCP 服务器调用,与命令共享同一执行层(executeXxx)。
  contact:
    name: 075dev

servers:
  - url: vscode://vscodeUEHelper
    description: 逻辑模型占位 —— 实际传输为 VSCode 命令通道与 MCP stdio,非 HTTP

tags:
  - name: Commands
    description: VSCode 命令(用户从命令面板/UI 触发,同步或长时间运行)
  - name: MCPTools
    description: MCP 工具(AI agent 经 MCP 服务器触发;dispatch 类为 fire-and-forget)

paths:
  # ─────────────────────────────────────────────
  # 构建域(UBT)
  # ─────────────────────────────────────────────
  /commands/build:
    post:
      tags: [Commands]
      operationId: vscodeUEHelper.build
      summary: UBT 增量构建当前 UE 项目
      description: 长时间运行(分钟级),同步等待;进度走 statusBar + logger,结构化结果入 lastBuild 快照。
      responses:
        '200': { $ref: '#/components/responses/BuildDone' }
        '500': { $ref: '#/components/responses/OpFailed' }

  /commands/rebuild:
    post:
      tags: [Commands]
      operationId: vscodeUEHelper.rebuild
      summary: UBT -Rebuild(Clean + Build)
      description: 同 build,模式为 rebuild。
      responses:
        '200': { $ref: '#/components/responses/BuildDone' }
        '500': { $ref: '#/components/responses/OpFailed' }

  /commands/clean:
    post:
      tags: [Commands]
      operationId: vscodeUEHelper.clean
      summary: UBT -Clean 清理中间产物
      responses:
        '200': { $ref: '#/components/responses/BuildDone' }
        '500': { $ref: '#/components/responses/OpFailed' }

  /commands/copyBuildCommand:
    post:
      tags: [Commands]
      operationId: vscodeUEHelper.copyBuildCommand
      summary: 复制当前配置的 UBT 构建命令行到剪贴板
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '500': { $ref: '#/components/responses/OpFailed' }

  /commands/liveCoding:
    post:
      tags: [Commands]
      operationId: vscodeUEHelper.liveCoding
      summary: 触发 Live Coding 热重载(仅 Windows)
      description: 依赖运行中的 Unreal Editor 与 Live Coding 控制台连接;bugfix/001 已修复连接已有项目场景。
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '409':
          description: Live Coding 不可用(Editor 未运行/控制台未连接)
          content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } }
        '500': { $ref: '#/components/responses/OpFailed' }

  /commands/generateCompileCommands:
    post:
      tags: [Commands]
      operationId: vscodeUEHelper.generateCompileCommands
      summary: 经 UBT -ProjectFiles 生成 compile_commands.json
      description: 长时间运行(分钟级),同步等待。
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '500': { $ref: '#/components/responses/OpFailed' }

  /commands/launchEditor:
    post:
      tags: [Commands]
      operationId: vscodeUEHelper.launchEditor
      summary: 启动 Unreal Editor 打开选中的 .uproject
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/OpFailed' }

  # ─────────────────────────────────────────────
  # 项目域(检测/诊断/资源管理器)
  # ─────────────────────────────────────────────
  /commands/showProjectInfo:
    post:
      tags: [Commands]
      operationId: vscodeUEHelper.showProjectInfo
      summary: 展示检测到的项目/引擎信息
      responses:
        '200':
          description: 项目信息(Webview/面板)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProjectInfo' }
        '404': { $ref: '#/components/responses/OpFailed' }

  /commands/diagnoseProject:
    post:
      tags: [Commands]
      operationId: vscodeUEHelper.diagnoseProject
      summary: 项目环境诊断(引擎路径/工具链/配置完整性)
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '500': { $ref: '#/components/responses/OpFailed' }

  /commands/createProject:
    post:
      tags: [Commands]
      operationId: vscodeUEHelper.createProject
      summary: 创建新 UE C++ 项目(向导式)
      description: 参数经 VSCode 向导交互收集,契约不定义向导内部字段。
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '500': { $ref: '#/components/responses/OpFailed' }

  /commands/refreshProjectExplorer:
    post:
      tags: [Commands]
      operationId: vscodeUEHelper.refreshProjectExplorer
      summary: 刷新项目资源管理器树视图
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /commands/openProjectExplorerFile:
    post:
      tags: [Commands]
      operationId: vscodeUEHelper.openProjectExplorerFile
      summary: 在编辑器中打开资源管理器选中的文件
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /commands/openWorkspaceFile:
    post:
      tags: [Commands]
      operationId: vscodeUEHelper.openWorkspaceFile
      summary: 打开工作区内指定文件
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                uri:
                  type: string
                  description: 目标文件 uri;缺省时交互选择
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /commands/openTerminalInNewWindow:
    post:
      tags: [Commands]
      operationId: vscodeUEHelper.openTerminalInNewWindow
      summary: 在新窗口终端中打开指定目录
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                uri:
                  type: string
                  description: 目标目录 uri;缺省时取工作区根
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /commands/switchHeaderSource:
    post:
      tags: [Commands]
      operationId: vscodeUEHelper.switchHeaderSource
      summary: 在活动编辑器的头文件与源文件之间切换
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404':
          description: 当前文件无对应头/源配对
          content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } }

  # ─────────────────────────────────────────────
  # clangd 域
  # ─────────────────────────────────────────────
  /commands/enableClangdProxy:
    post:
      tags: [Commands]
      operationId: vscodeUEHelper.enableClangdProxy
      summary: 启用 clangd 代理配置
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '500': { $ref: '#/components/responses/OpFailed' }

  /commands/disableClangdProxy:
    post:
      tags: [Commands]
      operationId: vscodeUEHelper.disableClangdProxy
      summary: 停用 clangd 代理配置
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /commands/showClangdProxyStatus:
    post:
      tags: [Commands]
      operationId: vscodeUEHelper.showClangdProxyStatus
      summary: 展示 clangd 代理状态
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /commands/setSystemIncludes:
    post:
      tags: [Commands]
      operationId: vscodeUEHelper.setSystemIncludes
      summary: 配置 Windows MSVC + Windows SDK 系统包含路径
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '500': { $ref: '#/components/responses/OpFailed' }

  /commands/installRules:
    post:
      tags: [Commands]
      operationId: vscodeUEHelper.installRules
      summary: 安装 .editorconfig/clangd 规则文件到项目
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /commands/noLintCurrentLine:
    post:
      tags: [Commands]
      operationId: vscodeUEHelper.noLintCurrentLine
      summary: 对当前行插入 clang-tidy 屏蔽注释
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /commands/noLintNextLine:
    post:
      tags: [Commands]
      operationId: vscodeUEHelper.noLintNextLine
      summary: 对下一行插入 clang-tidy 屏蔽注释
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  # ─────────────────────────────────────────────
  # 配置域
  # ─────────────────────────────────────────────
  /commands/selectConfig:
    post:
      tags: [Commands]
      operationId: vscodeUEHelper.selectConfig
      summary: 交互选择构建 Configuration(Development/Shipping 等)
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /commands/selectTarget:
    post:
      tags: [Commands]
      operationId: vscodeUEHelper.selectTarget
      summary: 交互选择构建 Target
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /commands/showControlPanel:
    post:
      tags: [Commands]
      operationId: vscodeUEHelper.showControlPanel
      summary: 打开控制面板(Webview)
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /commands/retryFirstTimeInit:
    post:
      tags: [Commands]
      operationId: vscodeUEHelper.retryFirstTimeInit
      summary: 重试首次初始化(引擎检测/clangd 引导)
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /commands/uninstall:
    post:
      tags: [Commands]
      operationId: vscodeUEHelper.uninstall
      summary: 从项目卸载本插件注入的配置/规则
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  # ─────────────────────────────────────────────
  # MCP 工具面(AI agent)
  # ─────────────────────────────────────────────
  # dispatch 类工具:callTool 同步签名,fire-and-forget —— 响应只确认 dispatch,
  # 真实进度走 logger(OutputChannel + Problems);结果经 ue_get_build_errors 回读。
  /mcp/tools/ue_build:
    post:
      tags: [MCPTools]
      operationId: ue_build
      summary: 构建/重建/清理(模式参数化),可选单模块过滤
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [build, rebuild, clean], default: build }
                module:
                  type: string
                  description: |
                    单模块编译(UBT `-Module=<名>`,add-002)。仅 mode=build 生效;
                    mode=rebuild/clean 携带时被忽略,dispatch 响应带 warning 说明。
                    语义边界:只编译该模块到目标文件(.obj)级,**不链接、不产出 DLL**,
                    定位是秒级验证编译错误;编出的 obj 会被后续全量构建增量复用。
                    模块名不预校验(合法集含插件/引擎模块,不可枚举);UBT 找不到时
                    构建失败,报错(`Unable to find output items for module`)进快照,
                    经 ue_get_build_errors 回读。
                    注意:编辑器 Live Coding 会话激活时 UBT 拒绝普通构建,属构建失败场景。
      responses:
        '200': { $ref: '#/components/responses/MCPDispatched' }

  /mcp/tools/ue_rebuild:
    post:
      tags: [MCPTools]
      operationId: ue_rebuild
      summary: UBT -Rebuild(独立工具名,意图命中更好)
      responses:
        '200': { $ref: '#/components/responses/MCPDispatched' }

  /mcp/tools/ue_clean:
    post:
      tags: [MCPTools]
      operationId: ue_clean
      summary: UBT -Clean
      responses:
        '200': { $ref: '#/components/responses/MCPDispatched' }

  /mcp/tools/ue_get_build_errors:
    post:
      tags: [MCPTools]
      operationId: ue_get_build_errors
      summary: 读取最近一次构建的结构化诊断(同步快照)
      description: |
        与 dispatch 类不同,本工具同步返回进程内 lastBuild 快照:
        MSVC/UBT 诊断(文件/行/列/错误码/消息)、错误/警告计数、含错文件清单。
        会话内尚无构建时返回 hasResult=false。
      responses:
        '200':
          description: 快照读取成功(含 hasResult=false 的空态)
          content:
            application/json:
              schema:
                type: object
                required: [ok, hasResult]
                properties:
                  ok: { type: boolean, const: true }
                  hasResult: { type: boolean }
                  build: { $ref: '#/components/schemas/BuildSummary' }

  /mcp/tools/ue_launch_editor:
    post:
      tags: [MCPTools]
      operationId: ue_launch_editor
      summary: 启动 Unreal Editor
      responses:
        '200': { $ref: '#/components/responses/MCPDispatched' }

  /mcp/tools/ue_live_coding:
    post:
      tags: [MCPTools]
      operationId: ue_live_coding
      summary: 触发 Live Coding 热重载(仅 Windows)
      responses:
        '200': { $ref: '#/components/responses/MCPDispatched' }

  /mcp/tools/ue_generate_compile_commands:
    post:
      tags: [MCPTools]
      operationId: ue_generate_compile_commands
      summary: 生成 compile_commands.json
      responses:
        '200': { $ref: '#/components/responses/MCPDispatched' }

  /mcp/tools/ue_show_project_info:
    post:
      tags: [MCPTools]
      operationId: ue_show_project_info
      summary: 展示项目/引擎信息
      responses:
        '200': { $ref: '#/components/responses/MCPDispatched' }

  /mcp/tools/ue_set_system_includes:
    post:
      tags: [MCPTools]
      operationId: ue_set_system_includes
      summary: 配置系统包含路径
      responses:
        '200': { $ref: '#/components/responses/MCPDispatched' }

# ============================================================
# 复用结构
# ============================================================
components:
  schemas:
    Envelope:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        summary:
          type: string
          description: 面向用户的一句话结果摘要(已本地化)
        error:
          $ref: '#/components/schemas/Error'

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - PROJECT_NOT_DETECTED    # 工作区无 .uproject
            - UBT_NOT_FOUND           # 引擎/UBT 路径不可用
            - BUILD_FAILED            # 构建退出码非 0(诊断见快照)
            - LIVE_CODING_UNAVAILABLE # Editor 未运行或控制台未连接
            - CLANGD_NOT_AVAILABLE    # clangd 不可用
            - OPERATION_CANCELLED     # 用户取消
            - MCP_CONTEXT_NOT_INITIALIZED
            - UNKNOWN_TOOL
            - INTERNAL_ERROR
        message: { type: string }
        details:
          type: object
          additionalProperties: true

    BuildResult:
      type: object
      required: [mode, exitCode]
      properties:
        mode: { type: string, enum: [build, rebuild, clean] }
        module:
          type: string
          description: 本次构建的单模块过滤(UBT -Module=,add-002);全 target 构建时缺省
        exitCode: { type: integer }
        durationMs: { type: integer }
        summary: { type: string }

    BuildSummary:
      type: object
      description: ue_get_build_errors 返回的构建摘要(与 summarizeBuildErrorsForAgent 对齐)
      required: [ok]
      properties:
        ok:
          type: boolean
          description: 构建级成败(与工具调用级 ok 分层,避免冲突)
        mode: { type: string, enum: [build, rebuild, clean] }
        module:
          type: string
          description: 快照对应的单模块过滤(UBT -Module=,add-002);全 target 构建时缺省
        exitCode: { type: integer }
        errorCount: { type: integer }
        warningCount: { type: integer }
        diagnostics:
          type: array
          description: 结构化 MSVC/UBT 诊断
          items:
            type: object
            required: [file, message]
            properties:
              file: { type: string }
              line: { type: integer }
              column: { type: integer }
              code: { type: string }
              message: { type: string }
        filesWithErrors:
          type: array
          items: { type: string }

    ProjectInfo:
      type: object
      properties:
        name: { type: string }
        uprojectPath: { type: string }
        enginePath: { type: string }
        engineVersion: { type: string }
        configs:
          type: array
          items: { type: string }
        targets:
          type: array
          items: { type: string }

    MCPDispatch:
      type: object
      required: [ok, dispatched]
      properties:
        ok: { type: boolean, const: true }
        dispatched: { type: string }
        mode: { type: string }
        warning:
          type: string
          description: 参数被忽略时的一句话说明(如 mode=rebuild/clean 携带 module,add-002)
        note:
          type: string
          description: 固定为 fire-and-forget 提示;真实进度经 logger 流出

  responses:
    Ok:
      description: 命令执行成功(envelope)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    BuildDone:
      description: 构建流程结束(成败以 data.exitCode / error 判定)
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/BuildResult' }
    OpFailed:
      description: 操作失败(envelope.ok=false + 结构化错误)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    MCPDispatched:
      description: dispatch 确认(fire-and-forget,不等待完成)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MCPDispatch' }

# ============================================================
# Clarifications(用户显式指令,2026-09-19)
# ============================================================
# - Q: 本阶段契约化范围? → A: 插件能力全景(27 命令 + 9 MCP 工具一次性全覆盖)
# - Q: 27 个命令在契约中如何建模? → A: RPC 式统一端点,每命令一个显式路径 /commands/{短名}
# - Q: 构建类长任务(分钟级)契约语义? → A: 如实同步描述(响应含退出码与摘要),不引入异步任务模型
# - Q: 是否建立项目宪法? → A: 建立(.planning/context/constitution.md)
#
# 默认假设(讨论中未逐条确认,构建/评审阶段可否决):
# - 响应统一 envelope {ok, summary?, data?, error?};纯 UI 命令也返回 envelope(目标口径,
#   构建阶段对齐,现状部分命令为 void + 消息展示)
# - MCP dispatch 类工具契约如实描述 fire-and-forget 语义(与 callTool 现实现一致)
# - 错误码枚举为全局统一清单(上表 9 项),按现有错误场景映射,不按域拆分
# - 验收口径:单元测试 mock vscode API(镜像 test/unit 现有结构),每端点可断言 envelope
